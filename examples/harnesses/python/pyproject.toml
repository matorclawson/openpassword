[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "openpassword-local"
version = "0.1.0"
description = "Native async client for the OpenPassword agent CLI"
requires-python = ">=3.11"
license = "MIT"

[tool.setuptools]
py-modules = ["openpassword_local"]
